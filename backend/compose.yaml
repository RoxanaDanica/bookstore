services:
  app:
    build: .
    container_name: book-store
    env_file: .env
    ports:
      - "3000:3300"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    container_name: mysql-db
    restart: always
    env_file: .env
    ports:
      - "3300:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes: 
  mysql_data:
